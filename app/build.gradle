plugins {
    id 'com.android.application'
}

android {
    namespace 'com.realme.edgevolume'
    compileSdk 34

    defaultConfig {
        applicationId "com.realme.edgevolume"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("release.keystore")
            storePassword "androidrelease"
            keyAlias "edgekey"
            keyPassword "androidrelease"
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure Android SDK implementation — zero external bloat, fast & reliable builds
}
